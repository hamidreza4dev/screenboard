name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The app targets macOS 26, so it needs the macOS 26 SDK from Xcode 26.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build ScreenBoard.app
        run: ./scripts/build-app.sh

      - name: Zip the app
        # ditto keeps the bundle's symlinks, permissions and signature intact.
        run: ditto -c -k --keepParent build/ScreenBoard.app build/ScreenBoard.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBoard
          path: build/ScreenBoard.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScreenBoard

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ScreenBoard.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "ScreenBoard $GITHUB_REF_NAME" \
            --generate-notes
